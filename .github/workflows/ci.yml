name: CI

# Runs on every push and every pull request against main. A capstone is not
# usually deployed continuously, but the value here is not deployment — it is
# that a change which breaks the suite is visible on GitHub before anyone
# pulls it, rather than on someone else's machine an hour later.
#
# Every step below names a `working-directory`, because the two stacks live in
# their own folders now: composer in `backend/`, npm in `frontend/`. A bare
# `composer install` at the repo root would find no composer.json and fail
# with a message that reads like a broken runner rather than a wrong path.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Tests (${{ matrix.database }})
    runs-on: ubuntu-latest

    # The suite runs on both drivers on purpose. Tests default to in-memory
    # SQLite for speed, but the app itself runs on Postgres, and a
    # Postgres-only bug — `ilike`, a stricter GROUP BY — never shows up on
    # SQLite. Running both is what keeps "the suite passes" meaningful.
    strategy:
      fail-fast: false
      matrix:
        # The database name is carried per leg rather than shared. Setting one
        # DB_DATABASE for both would override phpunit.xml's `:memory:` on the
        # SQLite leg — env vars win over PHPUnit's `<env>` entries, which is
        # the same property `composer test:pgsql` relies on — and SQLite would
        # try to open a *file* named primepower_hris_test.
        include:
          - database: sqlite
            db_database: ':memory:'
          - database: pgsql
            db_database: primepower_hris_test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: primepower_hris_test
        ports:
          - 5432:5432
        # Without the health check the job can start migrating before Postgres
        # is accepting connections, which fails as a confusing "connection
        # refused" rather than as "the database was not ready".
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          # pdo_pgsql for the Postgres leg, gd for the document scanner's
          # image handling, intl for Carbon's localised date formatting.
          extensions: pdo_pgsql, pdo_sqlite, gd, intl, bcmath
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}

      - name: Install PHP dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          # The lockfile is no longer at the root, and without this the cache
          # step fails outright rather than merely missing.
          cache-dependency-path: frontend/package-lock.json

      - name: Install JS dependencies
        working-directory: frontend
        run: npm ci

      # The root Blade view @vite's each page component by name, so an unbuilt
      # page throws and the feature test reports "Not a valid Inertia
      # response" — a failure that looks like a routing bug and is not one.
      #
      # This runs in `frontend/` and writes into `backend/public/build`, which
      # is where Laravel reads the manifest from — see frontend/vite.config.js.
      - name: Build assets
        working-directory: frontend
        run: npm run build

      - name: Prepare environment
        working-directory: backend
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        working-directory: backend
        env:
          DB_CONNECTION: ${{ matrix.database }}
          DB_DATABASE: ${{ matrix.db_database }}
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
        run: php artisan test

  quality:
    name: Formatting
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install PHP dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install JS dependencies
        working-directory: frontend
        run: npm ci

      # `--test` and `format:check` report rather than rewrite: CI should say
      # a file is unformatted, not quietly commit a fix nobody reviewed.
      - name: Check PHP formatting
        working-directory: backend
        run: vendor/bin/pint --test

      - name: Check JS formatting
        working-directory: frontend
        run: npm run format:check

      # Vite strips types without checking them, so nothing else in the
      # pipeline would notice a broken one. This is the only step that does.
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
